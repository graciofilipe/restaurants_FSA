<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Podcast Recommender - Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-container {
            background: #fff;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        .login-container h1 {
            margin-bottom: 20px;
            color: #333;
        }
        .login-container p {
            color: #666;
            margin-bottom: 30px;
        }
        .btn-login {
            display: inline-block;
            padding: 12px 24px;
            background-color: #4285F4;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            text-decoration: none;
            transition: background-color 0.3s;
        }
        .btn-login:hover {
            background-color: #357ae8;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>Podcast Recommender</h1>
        <p>Please sign in to access the podcast search engine.</p>
        <button id="login-btn" class="btn-login">Sign in with Google</button>
    </div>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
      import { getAuth, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

      // Firebase configuration from environment variables
      const firebaseConfig = {
        apiKey: "{{ firebase_api_key }}",
        authDomain: "{{ firebase_auth_domain }}",
        projectId: "{{ firebase_project_id }}",
        storageBucket: "{{ firebase_storage_bucket }}",
        messagingSenderId: "{{ firebase_messaging_sender_id }}",
        appId: "{{ firebase_app_id }}"
      };

      // Initialize Firebase
      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);

      const loginBtn = document.getElementById('login-btn');
      loginBtn.addEventListener('click', () => {
          const provider = new GoogleAuthProvider();
          signInWithPopup(auth, provider)
            .then((result) => {
              const user = result.user;
              console.log("User signed in:", user.displayName);

              // Get ID token and send to server for session cookie
              user.getIdToken().then((idToken) => {
                  fetch('/login', { // Ensure this matches your POST route
                      method: 'POST',
                      headers: {
                          'Content-Type': 'application/json'
                      },
                      body: JSON.stringify({ id_token: idToken })
                  }).then(response => {
                      if (response.ok) {
                          // Redirect to home page on success
                          window.location.href = "/";
                      } else {
                          console.error('Login failed on server side');
                          alert("Login failed. Please try again.");
                      }
                  });
              });

            }).catch((error) => {
              console.error("Auth Error:", error.code, error.message);
              alert("Authentication error: " + error.message);
            });
      });
    </script>
</body>
</html>
